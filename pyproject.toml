[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DynamicVL"
version = "0.0.1"
description = ""
authors = [
    {name = "Weihao Xuan", email = "weihaoxuanfoo@gmail.com"}
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "vllm>=0.8.5.post1",
    "qwen-vl-utils==0.0.10",
    "flash-attn>=2.7.2.post1",
    "numpy==1.26.4",
    "transformers==4.52.4",
    "accelerate",
    "peft",
    "albumentations==1.4.24",
    "python-dotenv",
    "shortuuid",
    "datasets",
    "matplotlib",
    "rasterio",
    "tifffile",
    "scikit-image",
    "torchmetrics",
    "evaluate",
    "pyyaml",
    "prettytable",
    "safetensors",
    "accelerate",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
